<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create New Lecture</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 40px; }
        .title { max-width: 600px; margin: 0 auto; }
    </style>
</head>
<body>
<div class="title">
    <h1>Create New Lecture</h1>
</div>
<div style="height: 24px;"></div>
<form method="POST" action="/app/createLecture">
    {% csrf_token %}

    <div>
        <label for="choice">Course name:</label>
        <input type="text" id="choice" name="choice" required>
    </div>
    <div style="height: 18px;"></div>
    <div>
        <label for="date">Date of lecture:</label>
        <input type="date" id="date" name="date">
    </div>
    <div style="height: 18px;"></div>
    <div>
        <label for="qr_id">QR identifier:</label>
        <input type="text" id="qr_id" name="qr_id" required>
    </div>
    <div style="height: 18px;"></div>
    <button type="submit">Create Lecture</button>
</form>
</body>
</html>
